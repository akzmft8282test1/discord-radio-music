:root{--bg:#f4f6fb;--card:#fff;--ink:#20283a;--muted:#667085;--line:#e5e9f2;--blue:#3457d5;--pale:#edf1ff;--gold:#fff5d9}

</style></head><body><header><div class="wrap"><h1>역사 기말고사 모의고사</h1><p>1차·2차·3차 실전 연습 · 회차별 객관식 20문제 + 주관식 4문제</p></div></header><nav><div class="wrap"><a href="#guide">시험 안내</a><a href="#exam">모의고사</a></div></nav>
<main class="wrap"><section class="card" id="guide"><h2>모의고사 이용 안내</h2><p>각 회차는 객관식 20문제와 주관식 4문제로 구성되어 있습니다. 객관식은 보기 하나를 선택하고, 주관식은 직접 답을 적은 뒤 정답·해설을 확인하세요.</p><div class="tip">객관식 1문제 4점, 주관식 1문제 5점으로 환산해 총점 100점으로 표시합니다. 주관식은 자기 답안을 정답 예시와 비교해 직접 채점하세요.</div></section>
<section class="card" id="exam"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><button onclick="showRound(0)" id="tab0">1차 모의고사</button><button class="secondary" onclick="showRound(1)" id="tab1">2차 모의고사</button><button class="secondary" onclick="showRound(2)" id="tab2">3차 모의고사</button></div><div id="roundArea"></div></section></main>
<script>

 h+=`</div><h2 style="margin-top:24px">주관식</h2>`;
 sh.forEach((x,i)=>{h+=`<div style="border-top:1px solid #e5e9f2;padding:14px 0"><h3>${i+1}. ${esc(x[0])}</h3><textarea id="short${i}" rows="3" style="width:100%;padding:10px;border:1px solid #d5dbea;border-radius:9px;font:inherit" placeholder="답을 입력하세요"></textarea><div id="sfb${i}" style="display:none;background:#f4f6fb;padding:10px;border-radius:9px;margin-top:8px"></div></div>`;});
 h+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px"><button onclick="grade()">객관식 채점하기</button><button class="secondary" onclick="reveal()">정답·해설 전체 보기</button><button class="secondary" onclick="resetRound()">답안 초기화</button></div><p id="score" style="font-weight:800;font-size:20px;margin-top:15px"></p>`;
 document.getElementById('roundArea').innerHTML=h;
}
function grade(){let correct=0,answered=0;rounds[current].forEach((x,i)=>{let v=document.querySelector('input[name="q'+i+'"]:checked');let fb=document.getElementById('fb'+i);fb.style.display='block';if(v){answered++;if(Number(v.value)===x[2]){correct++;fb.innerHTML='<b style="color:#16804a">정답</b> · '+esc(x[3]);}else{fb.innerHTML='<b style="color:#c0392b">오답</b> · 정답: '+(x[2]+1)+'번 · '+esc(x[3]);}}else{fb.innerHTML='<b>미응답</b> · 정답: '+(x[2]+1)+'번 · '+esc(x[3]);}});document.getElementById('score').textContent=`객관식 ${correct}/20 정답 · ${correct*4}점 (응답 ${answered}/20)`;}
function reveal(){rounds[current].forEach((x,i)=>{let fb=document.getElementById('fb'+i);fb.style.display='block';fb.innerHTML='<b>정답: '+(x[2]+1)+'번</b> · '+esc(x[3]);});shorts[current].forEach((x,i)=>{let fb=document.getElementById('sfb'+i);fb.style.display='block';fb.innerHTML='<b>정답 예시</b><br>'+esc(x[1]);});}
function resetRound(){render();}
showRound(0);
</script><footer>역사 기말고사 대비 · 제공된 역사.txt 내용 기준</footer></body></html>
