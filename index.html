<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서버 전용 상시 BGM 스트리밍 센터</title>
    <style>
        body {
            background-color: #2f3136;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-container {
            text-align: center;
            background-color: #202225;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h1 { font-size: 24px; margin-bottom: 20px; color: #5865F2; }
        p { color: #b9bbbe; margin-bottom: 30px; }
        audio { width: 300px; outline: none; }
    </style>
</head>
<body>

    <div class="player-container">
        <h1>📻 디스코드 봇 전용 라디오 센터</h1>
        <p>560MB 대용량 오디오 안정화 스트리밍 중...</p>
        
        <audio id="audioStream" controls preload="auto" loop></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
