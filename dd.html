function render(){
let D=EXAMS[current],root=document.getElementById('exam');root.innerHTML='<h2>'+(current+1)+'차 모의고사</h2><div id="mc"></div><h2>✍️ 서술형 (각 2점)</h2><div id="ess"></div>';document.getElementById('result').style.display='none';
D.q.forEach((q,i)=>{let el=document.createElement('div');el.className='box';el.innerHTML='<b>'+(i+1)+'. '+q[0]+'</b>'+shuffle(q[1].map((v,k)=>({v,k}))).map(o=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+o.k+'"> '+o.v+'</label>').join('')+'<div id="f'+i+'" class="muted"></div>';document.getElementById('mc').appendChild(el)});
D.e.forEach((e,i)=>{let el=document.createElement('div');el.className='box';el.innerHTML='<b>'+(i+19)+'. '+e[0]+'</b><textarea placeholder="답안을 작성하세요"></textarea><div class="rub"><b>자기 채점 핵심어 (각 0.5점)</b><br>'+e[1].map((k,j)=>'<label><input type="checkbox" id="r'+i+'_'+j+'"> '+k+'</label>').join('')+'<p class="muted">핵심어 체크당 0.5점 (최대 2점)</p></div><div id="ef'+i+'" class="muted"></div>';document.getElementById('ess').appendChild(el)});
}
function grade(){
let D=EXAMS[current],m=0,s=0;
D.q.forEach((q,i)=>{let a=document.querySelector('input[name=q'+i+']:checked'),f=document.getElementById('f'+i);if(a&&+a.value===q[2]){m++;f.innerHTML='<span class="good">정답!</span> '+q[3]}else f.innerHTML='<span class="bad">오답</span> 정답: '+q[1][q[2]]+' · '+q[3]});
D.e.forEach((e,i)=>{let n=e[1].filter((_,j)=>document.getElementById('r'+i+'_'+j).checked).length,p=Math.min(2,n*.5);s+=p;document.getElementById('ef'+i).innerHTML='자기 채점 '+p.toFixed(1)+' / 2점<br><b>예시 답안:</b> '+e[2]});
let total=m+s,r=document.getElementById('result');r.style.display='block';r.innerHTML='<h2>'+(current+1)+'차 채점 결과</h2>객관식 '+m+'/18점 · 서술형 '+s.toFixed(1)+'/8점<br><b>총 '+total.toFixed(1)+'/26점 · 환산 '+Math.round(total/26*100)+'점/100</b><p class="muted">서술형은 핵심어 체크 기준 자기 채점입니다.</p>';r.scrollIntoView({behavior:'smooth'})
}
render();
</script></body></html>
